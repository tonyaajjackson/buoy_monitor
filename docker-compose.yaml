version: "3.9"
services:
  graphite:
    container_name: graphite
    image: graphiteapp/graphite-statsd
    restart: "always"
    ports:
      - "8080:8080"
      - "2003-2004:2003-2004"
      - "2023-2024:2023-2024"
      - "8125:8125/udp"
      - "8126:8126"
    networks:
      - internal
    volumes:
      - ./graphite-conf:/opt/graphite/conf
      - graphite-storage:/opt/graphite/storage

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - internal
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel

networks:
  internal:

volumes:
  graphite-storage:
  grafana-storage: